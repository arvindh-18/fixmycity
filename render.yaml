# One-click deploy on Render: New → Blueprint → pick this repo.
# Creates the web service + a free Postgres database and wires DATABASE_URL for you.
# Fill the secret values (marked sync: false) when Render asks.
services:
  - type: web
    name: fixmycity
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fixmycity-db
          property: connectionString
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: WORKER_EMAILS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CITY_NAME
        value: Chennai
      - key: CITY_LAT
        value: "13.0827"
      - key: CITY_LNG
        value: "80.2707"

databases:
  - name: fixmycity-db
    plan: free
