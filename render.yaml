services:
  - type: web
    name: fixmycity-backend
    runtime: docker
    rootDir: backend
    plan: starter
    numInstances: 1
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: DB_USE_POOLER
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRY_HOURS
        value: "12"
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: openward
      - key: AI_PROVIDER
        value: rules
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: EMAIL_BACKEND
        value: smtp
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_STARTTLS
        value: "true"
      - key: ENABLE_BACKGROUND_JOBS
        value: "true"
      - key: ESCALATION_INTERVAL_SECONDS
        value: "60"
      - key: CITY_NAME
        value: Bengaluru
      - key: CITY_LAT
        value: "12.9716"
      - key: CITY_LNG
        value: "77.5946"

