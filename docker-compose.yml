# PostgreSQL 16 + PostGIS for local development.
#   docker compose up -d
# Creates databases "openward" and "openward_test" (user/password: openward/openward).
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: openward
      POSTGRES_PASSWORD: openward
      POSTGRES_DB: openward
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openward"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
