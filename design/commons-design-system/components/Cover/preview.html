<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Commons</title>
<style>
  html, body { margin:0; padding:0; height:100%; }
  body { background:var(--paper); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .green { fill:var(--green-600); }
  .sage { fill:var(--sage-300); }
  .yellow { fill:var(--yellow-400); }
  .rose { fill:var(--rose-500); }
  .deep { fill:var(--ink); }
  .frame { rx:var(--radius-none); }
  .cap { stroke:var(--ink); stroke-width:var(--stroke-frame); }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-family:var(--font-serif); font-size:100px; line-height:.92; font-weight:400; letter-spacing:-.02em; color:var(--ink); }
  .tag { margin:var(--space-4) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      green-600 144×176 (the action colour, largest) · sage-300 112×144 · yellow-400 128×104 bled off the top · ink 136×136 bled off the right · rose-500 48×48 once — ≈27% of 960×288
  arrangement staggered square frames at different heights, like the snapshots pinned across the hero; each sits on its own baseline
  pattern     editorial serif, "separate with lines, not shadows", short caption rules under frames → five stroke-frame ink rules, two under green, two under ink, one under yellow
  scales      sides in space-2 multiples; gaps space-4; rules space-2 apart; every corner radius-none
-->
<rect class="green frame" x="8" y="24" width="144" height="176"/>
<rect class="sage frame" x="168" y="88" width="112" height="144"/>
<rect class="yellow frame" x="296" y="-8" width="128" height="104"/>
<rect class="rose frame" x="296" y="128" width="48" height="48"/>
<rect class="deep frame" x="360" y="120" width="136" height="136"/>
<line class="cap" x1="8" y1="216" x2="80" y2="216"/>
<line class="cap" x1="8" y1="224" x2="44" y2="224"/>
<line class="cap" x1="296" y1="112" x2="352" y2="112"/>
<line class="cap" x1="360" y1="272" x2="424" y2="272"/>
<line class="cap" x1="360" y1="280" x2="392" y2="280"/>
</svg>
</div>
<div class="words">
<h1 class="name">Commons</h1>
<p class="tag">See it, report it, follow it through.</p>
</div>
</div>
</body>
</html>
