<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfaf7" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Work+Sans:wght@400;500&display=swap" />
    <script>
      // Apply a saved theme choice before first paint (otherwise the system setting is used).
      try { var t = localStorage.getItem("commons.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    <meta name="description" content="Report civic problems, track their progress, and see how your community's concerns are being addressed." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Commons — see it, report it, follow it through</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
